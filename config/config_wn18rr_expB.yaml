g_config: DistMult
d_config: TransE
test_batch_size: 100
dataset: wn18rr
task: all
KBGAN:
  # --- FINE-TUNING OVERRIDES ---
  g_optimizer: Adam
  d_optimizer: Adam
  g_learning_rate: 0.0001
  d_learning_rate: 0.0001

  # --- TRAINING LOOP SETTINGS ---
  n_epoch: 100
  epoch_per_test: 10
  n_batch: 256
  early_stop_patience: -1
  class_rank_balance: 0.5
  entity_uniform_max_ids: 2048

  # --- GENERATOR SETTINGS ---
  temperature: 3.0
  n_sample: 10
  n_candidate: 100
  negative_sampling_strategy: topk

  # --- DISCRIMINATOR GEOMETRY SETTINGS (v4) ---
  alpha: 1.0
  mu: 2.0
  uniform_lambda: 0.05
  lambda_anchor: 0.5
  true_align_gamma: 1.0
  fake_align_gamma: 1.0
  uniform_gamma: 0.05
  emb_uniform_scale: 2.0

  # --- COMPOSITION (if applicable to D) ---
  emb_align_op: 'mul'
  emb_align_balance: 0.7
TransE:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  margin: 3
  p: 1
  temp: 1
  n_epoch: 1000
  n_batch: 256
  epoch_per_test: 50
  model_file: TransE.mdl
TransD:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  margin: 3
  p: 1
  temp: 1
  n_epoch: 1000
  n_batch: 256
  epoch_per_test: 50
  model_file: TransD.mdl
DistMult:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  sigma: 0.2
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 1000
  n_batch: 256
  epoch_per_test: 50
  model_file: DistMult.mdl
ComplEx:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  sigma: 0.2
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 1000
  n_batch: 256
  epoch_per_test: 50
  model_file: ComplEx.mdl
log:
  dump_config: false
  to_file: true
  dir: ./log
  prefix: ""