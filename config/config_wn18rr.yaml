g_config: DistMult
d_config: TransE
test_batch_size: 100
dataset: wn18rr
# task: triple-classification
task: all
KBGAN:
  n_sample: 20
  n_epoch: 50
  n_batch: 100
  epoch_per_test: 10
  temperature: 1.0
  rank_class_balance: 5.0
  patience: 10
  optimizer_name: Adagrad
  early_stopping_pretrain: false
  early_stopping_train: false
TransE:
  dim: 50
  margin: 3
  p: 1
  n_epoch: 10
  n_batch: 100
  epoch_per_test: 5
  model_file: TransE.mdl
TransD:
  dim: 50
  margin: 3
  p: 1
  n_epoch: 10
  n_batch: 100
  epoch_per_test: 5
  model_file: TransD.mdl
DistMult:
  dim: 50
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 10
  n_batch: 100
  epoch_per_test: 5
  model_file: DistMult.mdl
ComplEx:
  dim: 25
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 10
  n_batch: 100
  epoch_per_test: 5
  model_file: ComplEx.mdl
log:
  dump_config: false
  to_file: true
  dir: ./log
  prefix: ""