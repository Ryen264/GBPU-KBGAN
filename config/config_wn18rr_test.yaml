g_config: DistMult
d_config: TransE
test_batch_size: 10
dataset: wn18rr
task: all
KBGAN:
  class_rank_balance: 0.5
  early_stop_patience: -1
  temperature: 1.0
  n_sample: 20
  n_candidate: 100
  n_epoch: 50
  n_batch: 10
  epoch_per_test: 10
  n_generated_valid_negative: 3
  negative_sampling_strategy: topk
  emb_uniform_scale: 2.0
  entity_uniform_max_ids: 1024
  uniform_gamma: 1.0
  true_align_gamma: 1.0
  fake_align_gamma: 1.0
  dens_beta: 0.5
  emb_align_op: 'add'
  emb_align_balance: 0.7
TransE:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  margin: 3
  p: 1
  temp: 1
  n_epoch: 10
  n_batch: 10
  epoch_per_test: 5
  model_file: TransE.mdl
TransD:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  margin: 3
  p: 1
  temp: 1
  n_epoch: 10
  n_batch: 10
  epoch_per_test: 5
  model_file: TransD.mdl
DistMult:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 50
  sigma: 0.2
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 10
  n_batch: 10
  epoch_per_test: 5
  model_file: DistMult.mdl
ComplEx:
  optimizer: Adagrad
  learning_rate: 0.01
  dim: 25
  sigma: 0.2
  lam: 0.1
  n_sample: 20
  sample_freq: 1
  n_epoch: 10
  n_batch: 10
  epoch_per_test: 5
  model_file: ComplEx.mdl
log:
  dump_config: false
  to_file: true
  dir: ./log
  prefix: ""